name: Build and run tests for progit2-gr book

on:
  push


jobs:
  checkout-progit2-english-version:
    runs-on: ubuntu-latest

    name: Download progit2

    steps:
      - name: Checkout progit2-en
        uses: actions/checkout@v5
        with:
          repository: progit/progit2
          path: progit2-en
        
      - name: Checkout progit2-gr
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}  #this is the current repository
          path: progit2-gr
    
      - name: Print the content of the current workspace
        run: |
          ls -la $GITHUB_WORKSPACE
          echo "This content is from the progit2-en"
          ls -la $GITHUB_WORKSPACE/progit2-en

          echo "\nThis content is from the progit2-gr"
          ls -la $GITHUB_WORKSPACE/progit2-gr
      
      - name: Print values
        run: |
          echo "The value of the GITHUB_REPOSITORY is"
          echo ${{ github.repository }}
      
      - name: Run the english version of findHttpsLinks
        run: |
          chmod +x $GITHUB_WORKSPACE/progit2-gr/findLinks_gr 
          $GITHUB_WORKSPACE/progit2-gr/findLinks_gr $GITHUB_WORKSPACE/progit2-gr/book/02-git-basics/sections

      - name: Check the $HOME after the run of the executable
        run: |
          ls -la $HOME
          ls -la $HOME/results
          ls -la $HOME/results/allFilesFromTheRoot_gr
          ls -la $HOME/results/check_gr
          
          echo "The results from the $GITHUB_REPOSITORY\n"
          ls -la $GITHUB_REPOSITORY
          ls -la $GITHUB_REPOSITORY/results
          ls -la $GITHUB_REPOSITORY/results/allFilesFromTheRoot_gr
          ls -la $GITHUB_REPOSITORY/results/check_gr

      # - name: The home directory in the github runner
      #   run: |
      #     echo "The tilda has the value of:"
      #     pwd
      #     echo ~
      #     echo $HOME

        

